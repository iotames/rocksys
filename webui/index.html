<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RockSys 控制台</title>
  <!-- 主题初始化（防闪烁）：读取本地保存的主题，未保存时默认浅色 -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('rocksys.theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'green') ? t : 'light');
    })();
  </script>
  <!-- 纯静态资源，全部本地相对路径，无任何外部依赖 -->
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 认证视图（登录/注册/重置，全屏覆盖） ============ -->
  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/>
          <path d="M8.5 12l2.5 2.5 4.5-4.5"/>
        </svg>
        <span class="brand-name">RockSys 控制台</span>
      </div>

      <!-- 登录面板 -->
      <div class="auth-panel" id="auth-panel-login">
        <h2 class="auth-title">登录</h2>
        <div class="form-row">
          <label class="form-label">用户名</label>
          <input class="input" id="auth-login-user" autocomplete="username" placeholder="请输入用户名">
        </div>
        <div class="form-row">
          <label class="form-label">密码</label>
          <input class="input" type="password" id="auth-login-pass" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary btn-block" id="auth-login-btn">登录</button>
      </div>

      <!-- 注册面板（全新系统初始化） -->
      <div class="auth-panel hidden" id="auth-panel-register">
        <h2 class="auth-title">初始化管理员</h2>
        <p class="auth-hint">系统尚未初始化，请设置超级管理员账号（仅一个）。</p>
        <div class="form-row">
          <label class="form-label">用户名</label>
          <input class="input" id="auth-reg-user" autocomplete="username" placeholder="请输入用户名">
        </div>
        <div class="form-row">
          <label class="form-label">密码（至少 8 位）</label>
          <input class="input" type="password" id="auth-reg-pass" autocomplete="new-password" placeholder="请输入密码">
        </div>
        <div class="form-row">
          <label class="form-label">确认密码</label>
          <input class="input" type="password" id="auth-reg-pass2" autocomplete="new-password" placeholder="请再次输入密码">
        </div>
        <button class="btn btn-primary btn-block" id="auth-reg-btn">注册并进入</button>
      </div>

      <!-- 重置面板（忘记密码，运维已改 ADMIN_INITIALIZED=false） -->
      <div class="auth-panel hidden" id="auth-panel-reset">
        <h2 class="auth-title">重置管理员凭证</h2>
        <p class="auth-hint">检测到已有管理员 <b id="auth-reset-user"></b>。忘记密码？请重设用户名与密码。</p>
        <div class="form-row">
          <label class="form-label">用户名</label>
          <input class="input" id="auth-reset-user-input" autocomplete="username" placeholder="请输入用户名">
        </div>
        <div class="form-row">
          <label class="form-label">新密码（至少 8 位）</label>
          <input class="input" type="password" id="auth-reset-pass" autocomplete="new-password" placeholder="请输入新密码">
        </div>
        <div class="form-row">
          <label class="form-label">确认新密码</label>
          <input class="input" type="password" id="auth-reset-pass2" autocomplete="new-password" placeholder="请再次输入新密码">
        </div>
        <button class="btn btn-primary btn-block" id="auth-reset-btn">重置并登录</button>
      </div>

      <div class="auth-error hidden" id="auth-error"></div>
    </div>
  </div>

  <!-- ============ 顶部工具条 ============ -->
  <header class="topbar">
    <div class="brand">
      <!-- 磐石盾牌标识 -->
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/>
        <path d="M8.5 12l2.5 2.5 4.5-4.5"/>
      </svg>
      <span class="brand-name">RockSys 控制台</span>
    </div>
    <div class="topbar-mid">
      <span class="gw-status" title="网关连通状态">
        <span class="dot dot-ok" id="gw-status-dot"></span>
        <span id="gw-status-text">网关在线</span>
      </span>
      <span class="gw-addr" id="gw-addr">管理地址：—</span>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="btn-token" title="设置访问凭证（Token）">访问凭证</button>
      <label class="topbar-label">主题
        <select id="theme-select" class="select select-sm">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
          <option value="green">护眼绿</option>
        </select>
      </label>
      <label class="topbar-label">自动刷新
        <select id="auto-refresh" class="select select-sm">
          <option value="0">关</option>
          <option value="5000" selected>5 秒</option>
          <option value="15000">15 秒</option>
          <option value="30000">30 秒</option>
        </select>
      </label>
      <button class="btn" id="btn-refresh" title="手动刷新当前页">
        <span class="refresh-ico">⟳</span> 刷新
      </button>
      <span class="updated" id="last-updated">最近更新 --:--:--</span>
    </div>
  </header>

  <!-- ============ 全局横幅：管理接口不可达 ============ -->
  <div id="unreachable-banner" class="banner hidden">
    <span class="banner-ico">⚠</span>
    <span>管理接口不可达，已保留上次数据（最后更新 <b id="banner-last-updated">--</b>）</span>
  </div>

  <!-- ============ 主体布局：侧边栏 + 主内容 ============ -->
  <div class="layout">
    <!-- 左侧侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <nav class="menu">
        <a class="menu-item" data-route="overview" href="#/overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>概览</span>
        </a>
        <a class="menu-item" data-route="components" href="#/components">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l10 6-10 6L2 8z"/><path d="M2 14l10 6 10-6"/>
          </svg>
          <span>组件</span>
        </a>
        <a class="menu-item" data-route="config" href="#/config">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h5M13 6h7M4 12h9M17 12h3M4 18h7M15 18h5"/>
            <circle cx="11" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="13" cy="18" r="2"/>
          </svg>
          <span>配置</span>
        </a>
        <a class="menu-item" data-route="scripts" href="#/scripts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6l-6 6 6 6"/><path d="M16 6l6 6-6 6"/>
          </svg>
          <span>脚本</span>
        </a>
        <div class="menu-group" id="menu-group-obs">
          <div class="menu-item menu-parent" data-group="obs">
            <span class="menu-parent-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 20V10M12 20V4M18 20v-6"/>
              </svg>
              <span>观测</span>
            </span>
            <span class="menu-arrow">▾</span>
          </div>
          <div class="menu-sub" id="menu-sub-obs">
            <a class="menu-item menu-sub-item" data-route="metrics" href="#/metrics">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19h16"/>
              </svg>
              <span>指标</span>
            </a>
            <a class="menu-item menu-sub-item" data-route="logs" href="#/logs">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
              </svg>
              <span>访问日志</span>
            </a>
            <a class="menu-item menu-sub-item" data-route="syslogs" href="#/syslogs">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5h16M4 12h16M4 19h10"/><circle cx="18" cy="19" r="2.5"/>
              </svg>
              <span>运行日志</span>
            </a>
          </div>
        </div>
      </nav>
      <div class="sidebar-foot">关闭只是降级，转发永不中断</div>
    </aside>

    <!-- 右侧主内容：6 个视图容器（JS 按路由切换显示） -->
    <main class="main" id="main">
      <section class="page" id="page-overview"></section>
      <section class="page hidden" id="page-components"></section>
      <section class="page hidden" id="page-config"></section>
      <section class="page hidden" id="page-scripts"></section>
      <section class="page hidden" id="page-metrics"></section>
      <section class="page hidden" id="page-logs"></section>
      <section class="page hidden" id="page-syslogs"></section>
    </main>
  </div>
</div>

<!-- 弹窗根容器 -->
<div id="modal-root"></div>
<!-- Toast 根容器（右上角消息提示） -->
<div id="toast-root"></div>

<!-- 全部逻辑：原生 JavaScript 模块（按依赖顺序加载，无任何第三方库） -->
<script src="./assets/js/util.js"></script>
<script src="./assets/js/theme.js"></script>
<script src="./assets/js/ui.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/state.js"></script>
<script src="./assets/js/components/head.js"></script>
<script src="./assets/js/components/empty.js"></script>
<script src="./assets/js/components/select.js"></script>
<script src="./assets/js/components/componentState.js"></script>
<script src="./assets/js/components/metrics.js"></script>
<script src="./assets/js/components/chart.js"></script>
<script src="./assets/js/components/configEditor.js"></script>
<script src="./assets/js/views/overview.js"></script>
<script src="./assets/js/views/components.js"></script>
<script src="./assets/js/views/config.js"></script>
<script src="./assets/js/views/scripts.js"></script>
<script src="./assets/js/views/metrics.js"></script>
<script src="./assets/js/views/logs.js"></script>
<script src="./assets/js/views/syslogs.js"></script>
<script src="./assets/js/views/auth.js"></script>
<script src="./assets/js/main.js"></script>
</body>
</html>
